<div class="dialog">
  <div class="dialog-header">
    <div class="dialog-title">New record</div>
    <div class="dialog-sub">Log a session for one of your activities</div>
  </div>

  <form class="fields" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="record-activity">Activity</label>
      <select
        id="record-activity"
        formControlName="activityId"
        [class.invalid]="activityIdControl.invalid && activityIdControl.touched"
      >
        <option value="">Select activity</option>
        @for (activity of activityStore.activities(); track activity.id) {
          <option [value]="activity.id">{{ activity.name }}</option>
        }
      </select>
      @if (activityIdControl.invalid && activityIdControl.touched) {
        <span class="field-error">Please select an activity</span>
      }
    </div>

    <div class="field-row">
      <div class="field">
        <label for="record-date">Date</label>
        <input
          id="record-date"
          type="date"
          formControlName="date"
          [class.invalid]="dateControl.invalid && dateControl.touched"
        />
        @if (dateControl.invalid && dateControl.touched) {
          <span class="field-error">Date is required</span>
        }
      </div>

      <div class="field">
        <label for="record-time">Time of day <span class="field-optional">optional</span></label>
        <select id="record-time" formControlName="timeOfDay">
          <option value="">—</option>
          @for (option of timeOfDayOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
    </div>

    <div class="field">
      <label for="record-duration"
        >Duration (minutes) <span class="field-optional">optional</span></label
      >
      <input
        id="record-duration"
        type="number"
        formControlName="durationMinutes"
        placeholder="e.g. 60"
        min="1"
      />
    </div>

    <div class="field">
      <label for="record-notes">Notes <span class="field-optional">optional</span></label>
      <textarea
        id="record-notes"
        formControlName="description"
        placeholder="How did it go?"
      ></textarea>
    </div>
  </form>

  <div class="actions">
    <button class="btn-cancel" type="button" (click)="cancel()">Cancel</button>
    <button class="btn-primary" type="button" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Creating...' : 'Create record' }}
    </button>
  </div>
</div>
