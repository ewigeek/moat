<h2 mat-dialog-title>New activity</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="name" placeholder="e.g. Bouldering" (keyup.enter)="submit()" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button (click)="submit()" [disabled]="!name.trim() || loading">
    {{ loading ? 'Creating...' : 'Create' }}
  </button>
</mat-dialog-actions>
