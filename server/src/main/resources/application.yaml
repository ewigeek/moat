spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moat}
    username: ${DB_USER:moat}
    password: ${DB_PASSWORD:moat}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/moat}
logging:
  level:
    "[org.springframework.security]": DEBUG

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui
