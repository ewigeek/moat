<div>
  <app-activity-record-form />

  @if (store.loading()) {
    <p>Loading...</p>
  } @else if (store.error()) {
    <p>{{ store.error() }}</p>
  } @else {
    <ul>
      @for (record of store.records(); track record.id) {
        <li>{{ record.date }} — {{ getActivityName(record.activityId) }}</li>
      }
    </ul>
  }
</div>
