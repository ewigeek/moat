<h2 mat-dialog-title>New record</h2>

<mat-dialog-content>
  <div class="form-fields">
    <mat-form-field appearance="outline">
      <mat-label>Activity</mat-label>
      <mat-select [(ngModel)]="activityId">
        @for (activity of activityStore.activities(); track activity.id) {
          <mat-option [value]="activity.id">{{ activity.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="date" />
      <mat-datepicker-toggle matIconSuffix [for]="picker" />
      <mat-datepicker #picker />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Duration (minutes)</mat-label>
      <input matInput type="number" [(ngModel)]="durationMinutes" placeholder="Optional" />
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button (click)="submit()" [disabled]="!activityId || !date || loading">
    {{ loading ? 'Creating...' : 'Create record' }}
  </button>
</mat-dialog-actions>
